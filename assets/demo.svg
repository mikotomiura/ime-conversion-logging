<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" width="960" height="410" role="img" aria-labelledby="t d">
<title id="t">How the logger records a conversion</title>
<desc id="d">Left: the romaji n, i, h, o, n, g, o typed with the input method on become the reading nihongo, Space converts it and Enter commits it. Right: the rows the logger writes at the same times, a key category and a time for every key press and, when the conversion ends, its duration, the number of arrow-key presses during it and whether it was abandoned; no character is written.</desc>
