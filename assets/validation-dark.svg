  <polygon points="798,256 789,251 789,261" fill="#9198a1"/>
  <text x="300" y="334" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#9198a1">the executor's record: the trials and the presses sent</text>
