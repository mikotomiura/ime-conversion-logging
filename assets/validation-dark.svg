<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="t d">
  <title id="t">How the logger was validated</title>
  <desc id="d">A plan generated from the phrase corpus and the settings drives an executor that sends every key press and release and records what it sent. The presses reach the input method and a reference input field, which records the calls it receives without text, and the logger, which writes key categories, times and a row per conversion session that it detects (on macOS inferred from the key presses, on Windows while a window of the input method is visible). The sessions of the reference and the rows of the logger are matched by wall-clock time under the registered rules, with the trials and the presses sent taken from the executor's record: detection, duration, arrow-key presses and abandonment.</desc>
  <rect x="0.5" y="0.5" width="959" height="359" rx="12" fill="#0d1117" stroke="#30363d"/>
  <text x="24" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#f0f6fc" font-weight="600">How the logger was validated</text>
  <text x="24" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9198a1">Synthetic input in a pre-registered study. The logger and a reference input field record the same runs.</text>
  <rect x="24" y="140" width="150" height="116" rx="10" fill="#161b22" stroke="#30363d"/>
  <rect x="38" y="150" width="36" height="4" rx="2" fill="#4493f8"/>
  <text x="38" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#f0f6fc" font-weight="600">Plan</text>
  <text x="38" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9198a1">Generated from the</text>
  <text x="38" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9198a1">phrase corpus and</text>
  <text x="38" y="236" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9198a1">the settings with a seed</text>
  <rect x="204" y="140" width="158" height="116" rx="10" fill="#161b22" stroke="#30363d"/>
  <rect x="218" y="150" width="36" height="4" rx="2" fill="#4493f8"/>
  <text x="218" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#f0f6fc" font-weight="600">Executor</text>
  <text x="218" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9198a1">Sends every key press</text>
  <text x="218" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9198a1">and release, and records</text>
  <text x="218" y="236" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9198a1">what it sent</text>
  <rect x="394" y="80" width="170" height="100" rx="10" fill="#161b22" stroke="#30363d"/>
  <rect x="408" y="90" width="36" height="4" rx="2" fill="#4493f8"/>
  <text x="408" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#f0f6fc" font-weight="600">Input method</text>
  <text x="408" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9198a1">macOS Japanese input</text>
  <text x="408" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9198a1">or Microsoft IME</text>
  <rect x="596" y="80" width="170" height="100" rx="10" fill="#161b22" stroke="#30363d"/>
  <rect x="610" y="90" width="36" height="4" rx="2" fill="#4493f8"/>
  <text x="610" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#f0f6fc" font-weight="600">Reference field</text>
  <text x="610" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9198a1">Records the calls it</text>
  <text x="610" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9198a1">receives. No text.</text>
  <rect x="394" y="206" width="372" height="110" rx="10" fill="#161b22" stroke="#30363d"/>
  <rect x="408" y="216" width="36" height="4" rx="2" fill="#4493f8"/>
  <text x="408" y="242" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#f0f6fc" font-weight="600">Logger</text>
  <text x="408" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9198a1">Key categories, times and one row per conversion session.</text>
  <text x="408" y="284" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9198a1">macOS: sessions inferred from the key presses.</text>
  <text x="408" y="302" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9198a1">Windows: while a window of the input method is visible.</text>
  <rect x="798" y="124" width="138" height="150" rx="10" fill="#161b22" stroke="#30363d"/>
  <rect x="812" y="134" width="36" height="4" rx="2" fill="#3fb950"/>
  <text x="812" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#f0f6fc" font-weight="600">Matching</text>
  <text x="812" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9198a1">By wall-clock time,</text>
  <text x="812" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9198a1">by registered rules:</text>
  <text x="812" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9198a1">detection, duration,</text>
  <text x="812" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9198a1">arrow-key presses,</text>
  <text x="812" y="256" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9198a1">abandonment</text>
